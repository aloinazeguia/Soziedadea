<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fakturaren tiketa</title>
    <link rel="stylesheet" href="../css/factura.css">
    <link rel="stylesheet" href="../../components/AlertComponents.css">
</head>
<body>
    <main>
        <div id="ticket">
            <!-- Datos empresa -->
            <div class="empresa">CIFP Usurbil LHII</div>
            <div class="datosEmpresa">
                Etarte bidea<br>
                9<br>
                Zubieta-Usurbil<br>
                20170<br>
                943364600
            </div>

            <!-- Encabezado -->
            <div class="section bold">FAKTURA ERRAZTUA</div>
            <div class="section" id="fecha-hora"></div>
            <div class="section" id="sala-mesa"></div>
            <div class="section" id="forma-pago"></div>

            <!-- Lista de productos -->
            <ul id="listaCobro" class="section"></ul>

            <!-- Totales -->
            <div class="total">
                <div class="section">GUZTIRA</div>
                <div class="section" id="total"></div>
            </div>

            <!-- Detalles adicionales -->
            <div class="section">Zerga-oinarria: <span id="base-iva"></span> €</div>
            <div class="section">BEZ-kuota (%10): <span id="cuota-iva"></span> €</div>

        </div>

        <!-- Botón para imprimir -->
        <button id="boton-imprimir">Inprimatu</button>
    </main>

    <script type="module" src="../js/subtotal.js"></script>
</body>
</html>
